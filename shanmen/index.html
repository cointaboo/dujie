<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>山门 · 修仙养成</title><style>
:root{--panel:rgba(18,32,29,.94);--line:rgba(201,162,39,.22);--ink:#e9e3d2;--dim:#8b9a92}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#070d0c;color:var(--ink);font:15px/1.65 "Songti SC","Noto Serif SC",serif;max-width:460px;margin:0 auto;padding-bottom:20px}
#scene{position:relative;height:168px;background:#0b1412 center/cover no-repeat;border-bottom:1px solid var(--line)}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(4,10,9,.3),rgba(4,10,9,.92))}
#scene .t{position:absolute;left:14px;bottom:10px;z-index:2}
#scene .t b{font-size:20px;letter-spacing:4px;color:#f0e2b4;text-shadow:0 2px 12px #000}
#scene .t span{display:block;font-size:12px;color:#b9b0c9}
#date{position:absolute;right:14px;top:10px;z-index:2;font-size:12px;color:#cfc7ae}
.wrap{padding:12px 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.row b{color:var(--ink);font-weight:500}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.rel{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0;color:var(--dim)}
.rel .n{width:44px}.rel .bar{flex:1;margin:0}.rel b{width:28px;text-align:right;color:var(--ink);font-weight:400}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#16261f,#0d1815);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.act:active{transform:scale(.98)}.act:disabled{opacity:.35}
.act small{display:block;font-size:11px;color:var(--dim);margin-top:3px;line-height:1.4}
#log{height:118px;overflow-y:auto;font-size:13px;line-height:1.8;color:#cfc7ae}
.g{color:#8fd6a8}.b{color:#e0806a}.y{color:#e8c96a}.p{color:#c9a9e0}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(4,9,8,.93);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:100%;max-width:420px;background:linear-gradient(180deg,#16261f,#0b1513);border:1px solid rgba(201,162,39,.35);border-radius:16px;padding:18px}
.modal h2{margin:0 0 6px;font-size:19px;letter-spacing:3px;color:#f0e2b4}
.modal p{margin:0 0 12px;font-size:13.5px;color:#c3bbcd;line-height:1.8}
.opt{padding:12px 14px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:#12211e;font-size:14px;cursor:pointer}
.opt i{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-style:normal}
.hide{display:none!important}
.foot{text-align:center;font-size:11px;color:#5d6a64}
</style></head><body>
<div id="scene"><div id="date"></div><div class="t"><b id="realmName">练气</b><span id="realmHint"></span></div></div>
<div class="wrap">
<div class="card">
 <div class="row"><span>道行</span><b id="v-dao">0</b></div><div class="bar"><i id="b-dao" style="background:linear-gradient(90deg,#3f8f6f,#7fc0a8)"></i></div>
 <div class="row"><span>气血</span><b id="v-hp">0</b></div><div class="bar"><i id="b-hp" style="background:linear-gradient(90deg,#8f2b22,#e0a05a)"></i></div>
 <div class="row"><span>心性</span><b id="v-mind">0</b></div><div class="bar"><i id="b-mind" style="background:linear-gradient(90deg,#3f6fa8,#8fb8e0)"></i></div>
 <div class="row"><span>人望</span><b id="v-fame">0</b></div><div class="bar"><i id="b-fame" style="background:linear-gradient(90deg,#7a6420,#d4af37)"></i></div>
 <div class="row" style="margin-top:5px"><span>灵石</span><b id="v-stone">0</b></div>
</div>
<div class="card">
 <div class="rel"><span class="n">师门</span><div class="bar"><i id="b-master" style="background:#c9a227"></i></div><b id="v-master">0</b></div>
 <div class="rel"><span class="n">同门</span><div class="bar"><i id="b-peer" style="background:#4f9e86"></i></div><b id="v-peer">0</b></div>
 <div class="rel"><span class="n">道侣</span><div class="bar"><i id="b-love" style="background:#b45a7a"></i></div><b id="v-love">0</b></div>
 <div class="rel"><span class="n">宿敌</span><div class="bar"><i id="b-foe" style="background:#a8342a"></i></div><b id="v-foe">0</b></div>
</div>
<div class="card"><div id="log"></div></div>
<div class="card"><div class="row"><span>本旬尚可行动</span><b id="left">3 次</b></div>
 <div class="acts" id="acts"></div></div>
<div class="foot" id="foot"></div>
</div>
<div id="modal" class="overlay hide"><div class="modal" id="modalBox"></div></div>
<script>
const VOICE=new Audio(); let muted=false;
function voice(n){ if(muted)return; try{ VOICE.src='../voice/'+n+'.mp3?v=6'; VOICE.play().catch(()=>{});}catch(e){} }

/* ===== 数据 ===== */
const REALMS = [
 {n:'练气', need:60}, {n:'筑基', need:110}, {n:'金丹', need:170}, {n:'元婴', need:240},
 {n:'化神', need:320}, {n:'炼虚', need:410}, {n:'合体', need:510}, {n:'大乘', need:620},
 {n:'渡劫', need:740}, {n:'仙', need:999}
];
const TRIAL = [
 {id:'lianqi', t:'饥寒',   q:'饿的时候，道是很远的东西。'},
 {id:'zhuji',  t:'别离',   q:'有些门，出去一次就再也推不开了。'},
 {id:'jindan', t:'名利',   q:'第一次收下的时候，手是抖的。'},
 {id:'yuanying',t:'病苦',  q:'年轻时拿命换钱，老了拿钱换命。'},
 {id:'huashen',t:'众叛',   q:'你解释一次，他们说你狡辩。'},
 {id:'lianxu', t:'孤绝',   q:'越往上走，能听懂你说话的人越少。'},
 {id:'heti',   t:'衰朽',   q:'时间不跟你吵，它只是每天都在拿走一点。'},
 {id:'dacheng',t:'权柄',   q:'权力不腐蚀人，它只是把人放大了。'},
 {id:'dujie',  t:'死惧',   q:'你不是怕死，你是怕死了也没人记得。'},
 {id:'xian',   t:'虚无',   q:'天门开了，门口站的是你。'}
];
const ACTS = [
 {id:'xiu', n:'打坐', d:'道行 +5~9 · 气血 +1~3', fx:{dao:[5,9], mind:[0,2], hp:[1,3]}},
 {id:'yao', n:'采药', d:'气血 +10~16 · 灵石 +2~6', fx:{hp:[10,16], stone:[2,6]}},
 {id:'fang',n:'访友', d:'人望 +3~6 · 同门 +5~9', fx:{fame:[3,6], peer:[5,9]}},
 {id:'jian',n:'练剑', d:'道行 +5~9 · 气血 −3~1 · 宿敌 +2', fx:{dao:[5,9], hp:[-3,-1], foe:[2,3]}},
 {id:'shi', n:'侍奉', d:'师门 +6~10 · 心性 +2', fx:{master:[6,10], mind:[2,3]}},
 {id:'wu',  n:'悟道', d:'心性 +5~9，但有反噬', gamble:true}
];
/* 月度事件：选择改属性，有的会留下 flag */
const EVENTS = [
 {id:'tang', t:'夜里的糖', txt:'枕边多了一包糖，纸粗，带着熏香。',
  opts:[{n:'收好，第二天问', fx:{love:[3,5]}, flag:'tang_kept'},
        {n:'分给最小的那个', fx:{peer:[6,9], love:[2,3]}},
        {n:'不动，放回原处', fx:{mind:[3,5]}}]},
 {id:'yao', t:'药庐缺人', txt:'药庐的老修士缺个帮手，活儿累，但能学东西。',
  opts:[{n:'去帮忙', fx:{dao:[4,7], hp:[-8,-4], master:[3,5]}},
        {n:'推说身子弱', fx:{mind:[2,3], master:[-3,-1]}}]},
 {id:'jiu', t:'同门借灵石', txt:'同门弟子红着脸，说家里出了事。',
  opts:[{n:'借 20 灵石', cost:20, fx:{peer:[8,12], fame:[2,4]}, flag:'lent'},
        {n:'只借 5', cost:5, fx:{peer:[3,5]}},
        {n:'说没有', fx:{peer:[-4,-2], mind:[1,2]}}]},
 {id:'jian',t:'后山有人', txt:'后山石阶上坐着个人，看见你，站了起来。',
  opts:[{n:'迎上去', fx:{foe:[6,9], dao:[3,5]}},
        {n:'绕开', fx:{mind:[2,4], fame:[-2,-1]}}]},
 {id:'shi', t:'师父问话', txt:'师父问你这半年学了什么。',
  opts:[{n:'照实说', fx:{master:[5,8], mind:[2,3]}},
        {n:'挑好听的说', fx:{master:[8,12], mind:[-3,-1]}, flag:'lied'}]},
 {id:'yu',  t:'雨夜', txt:'雨下了三天，你在窗边坐了很久。',
  opts:[{n:'继续打坐', fx:{dao:[5,8], hp:[-4,-2]}},
        {n:'睡一觉', fx:{hp:[6,9], mind:[1,2]}}]},
 {id:'jiu2',t:'酒席', txt:'山门办席，有人来敬酒。',
  opts:[{n:'喝', fx:{fame:[4,7], hp:[-5,-2]}},
        {n:'推了', fx:{mind:[2,3], fame:[-3,-1]}}]},

 {id:'repay', t:'他还了灵石', txt:'当年借你灵石的师弟，如今在外门做了执事。', req:{flag:'lent'},
  opts:[{n:'收下十倍奉还', fx:{stone:[0,0], peer:[10,15], fame:[3,6]}, flag:'repaid'},
        {n:'只收本钱', fx:{peer:[14,18], mind:[2,4]}}]},
 {id:'caught', t:'残卷事发', txt:'藏书阁丢了东西，执事在查。', req:{flag:'stole_book'},
  opts:[{n:'自己认了', fx:{master:[-12,-6], mind:[4,6], fame:[-4,-2]}},
        {n:'咬死不认', fx:{mind:[-4,-2], peer:[-6,-2]}, flag:'denied'}]},
 {id:'trust', t:'师父的疑心', txt:'师父问你上次那句话，是不是真的。', req:{flag:'lied'},
  opts:[{n:'说实话', fx:{master:[-8,-3], mind:[5,8]}},
        {n:'继续编', fx:{master:[2,6], mind:[-4,-2]}}]},
 {id:'love1', t:'她递了伞', txt:'雨里，有人把伞往你这边偏了偏。', req:{min:{love:35}},
  opts:[{n:'接过来', fx:{love:[10,16], mind:[2,4]}, flag:'umbrella'},
        {n:'说不用', fx:{love:[-6,-2], mind:[3,5]}}]},
 {id:'love2', t:'山门外', txt:'她说家里给她定了亲事，问你有没有话要说。', req:{min:{love:60}},
  opts:[{n:'留下她', fx:{love:[16,22], master:[-8,-3], fame:[-6,-2]}, flag:'kept_her'},
        {n:'让她走', fx:{love:[-14,-8], mind:[6,10]}}]},
 {id:'foe1',t:'约战', txt:'后山那位递了帖子，三日后石台见。', req:{min:{foe:45}},
  opts:[{n:'去', duel:true},
        {n:'不去', fx:{foe:[6,10], fame:[-8,-4], mind:[-3,-1]}}]},
 {id:'broke',t:'灵石见底', txt:'库里只剩几块下品灵石了。', req:{max:{stone:8}},
  opts:[{n:'去山下做工', fx:{stone:[18,26], dao:[-6,-2], fame:[2,4]}},
        {n:'省着用', fx:{hp:[-6,-2], mind:[3,5]}}]},
 {id:'sick', t:'风寒', txt:'你夜里咳了半宿。', req:{max:{hp:45}},
  opts:[{n:'去药庐', cost:10, fx:{hp:[18,26], stone:[-10,-10]}},
        {n:'硬撑', fx:{hp:[-8,-4], dao:[3,6]}}]},
 {id:'shu', t:'藏书阁', txt:'阁里有一本没登记的残卷。',
  opts:[{n:'抄一份', fx:{dao:[6,9], mind:[-2,-1]}, flag:'stole_book'},
        {n:'报给执事', fx:{master:[6,9], peer:[-3,-1]}}]}
];

const KEY='shanmen_v2';
let S=null;
function fresh(){return{y:1,m:1,x:1,left:3,dao:12,hp:70,mind:20,fame:6,stone:10,master:10,peer:8,love:0,foe:0,realm:0,wounds:0,flags:{},lives:1,log:['你被送进山门那日，雪还没化。']};}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.dao!=null){S=d;return;}}catch(e){}S=fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v)=>Math.max(0,Math.min(100,v));
function addLog(t,c){S.log.unshift({t,c:c||''});if(S.log.length>60)S.log.pop();}
function realm(){return REALMS[S.realm];}
function render(){
 const R=realm();
 $('#date').textContent=`第${S.y}年 · ${['正','二','三','四','五','六','七','八','九','十','冬','腊'][S.m-1]}月 · ${['上','中','下'][S.x-1]}旬`;
 $('#realmName').textContent=`${R.n} · 第${S.lives}世`;
 $('#realmHint').textContent=`道行 ${Math.round(S.dao)} / ${R.need}`;
 $('#scene').style.backgroundImage=`url('../art/${TRIAL[Math.min(9,S.realm)].id}.jpg?v=3')`;
 ['dao','hp','mind','fame'].forEach(k=>{$('#v-'+k).textContent=Math.round(S[k]);$('#b-'+k).style.width=clamp(S[k])+'%';});
 $('#v-stone').textContent=S.stone;
 ['master','peer','love','foe'].forEach(k=>{$('#v-'+k).textContent=S[k];$('#b-'+k).style.width=clamp(S[k])+'%';});
 $('#left').textContent=S.left+' 次';
 $('#acts').innerHTML=ACTS.map(a=>`<button class="act" data-a="${a.id}" ${S.left<=0?'disabled':''}>${a.n}<small>${a.d}</small></button>`).join('');
 $('#acts').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doAct(b.dataset.a));
 $('#log').innerHTML=S.log.map(l=>`<div class="${l.c}">${l.t}</div>`).join('');
}
function label(k){return{dao:'道行',hp:'气血',mind:'心性',fame:'人望',master:'师门',peer:'同门',love:'道侣',foe:'宿敌'}[k]||k;}
function doAct(id){
 if(S.left<=0)return;
 const a=ACTS.find(x=>x.id===id);S.left--;
 if(a.gamble){
  if(Math.random()<0.62){const g=rnd(5,9);S.mind=clamp(S.mind+g);addLog(`对着山雾坐了半日，忽然明白一点。心性 +${g}`,'g');}
  else{const l=rnd(3,7);S.hp=clamp(S.hp-l);S.mind=clamp(S.mind+2);addLog(`想得太深，气机乱了。气血 −${l}，心性 +2`,'b');}
 }else{
  const parts=[];
  for(const [k,v] of Object.entries(a.fx)){
   const d=Array.isArray(v)?rnd(v[0],v[1]):v;
   if(k==='stone'){S.stone=Math.max(0,S.stone+d);parts.push(`灵石 ${d>=0?'+':''}${d}`);}
   else{ S[k] = (k==='dao') ? Math.min(realm().need, Math.max(0,S[k]+d)) : clamp(S[k]+d); parts.push(`${label(k)} ${d>=0?'+':''}${d}`); }
  }
  addLog(`${a.n}：${parts.join(' · ')}`,'y');
 }
 if(S.hp<=0){ S.wounds=(S.wounds||0)+1;
   if(S.wounds>=3) return endLife('气竭');
   S.hp=1; S.dao=Math.round(S.dao*0.85);
   addLog('你伤了根本，勉强撑住。（重伤 '+S.wounds+'/3）','b');
 }
 if(S.dao>=realm().need && (S.realmXun||0)>=4) return breakthrough();
 if(S.left===0)return endXun();
 render();save();
}
function endXun(){
 S.x++;
 if(S.x>3){
  S.x=1;S.m++;S.realmXun=(S.realmXun||0)+1;S.master=clamp(S.master-1);
  if(S.m>12){ S.m=1; S.y++; return showTrial(); }
  if(Math.random()<0.8)return showEvent();
 }
 S.left=3;addLog('—— 新的一旬 ——','g');render();save();
}
function afterEvent(){
 S.left=3;
 addLog('—— 新的一旬 ——','g');
 if(S.dao>=realm().need && (S.realmXun||0)>=4) return breakthrough();
 render();save();
}
function eligible(ev){
 if(!ev.req) return true;
 const q=ev.req;
 if(q.flag && !S.flags[q.flag]) return false;
 if(q.min) for(const k in q.min) if((S[k]||0) < q.min[k]) return false;
 if(q.max) for(const k in q.max) if((S[k]||0) > q.max[k]) return false;
 return true;
}
function showEvent(){
 const used=S.used||[];
 let pool=EVENTS.filter(e=>eligible(e)&&!used.includes(e.id));
 if(!pool.length){ S.used=[]; pool=EVENTS.filter(eligible); }
 const ev=pool.length? pool[rnd(0,pool.length-1)] : EVENTS[rnd(0,EVENTS.length-1)];
 S.used=(S.used||[]).concat(ev.id).slice(-6);
 const box=$('#modalBox');
 box.innerHTML=`<h2>${ev.t}</h2><p>${ev.txt}</p>`+ev.opts.map((o,i)=>`<div class="opt" data-i="${i}">${o.n}${o.cost?`<i>需灵石 ${o.cost}</i>`:''}</div>`).join('');
 $('#modal').classList.remove('hide');
 box.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
  const o=ev.opts[+el.dataset.i];
  if(o.cost&&S.stone<o.cost){addLog('灵石不够。','b');$('#modal').classList.add('hide');return afterEvent();}
  if(o.cost)S.stone-=o.cost;
  if(o.duel){
    const mine=Math.round(S.dao*0.7+S.hp*0.4+S.mind*0.3);
    const his=Math.round(60+S.foe*1.2+Math.random()*40);
    $('#modal').classList.add('hide');
    if(mine>=his){ S.foe=Math.max(0,S.foe-18); S.fame=clamp(S.fame+8); S.dao=Math.round(S.dao*1.15);
      addLog(`石台上你赢了。宿敌 −18，人望 +8`,'g'); }
    else { const d=rnd(12,22); S.hp=clamp(S.hp-d); S.foe=clamp(S.foe+6);
      addLog(`石台上你输了，气血 −${d}，宿敌 +6`,'b');
      if(S.hp<=0){ return endLife('约战殒命'); } }
    return afterEvent();
  }
  const parts=[];
  for(const [k,v] of Object.entries(o.fx||{})){const d=Array.isArray(v)?rnd(v[0],v[1]):v; S[k]=(k==='dao')?Math.min(realm().need,Math.max(0,S[k]+d)):clamp(S[k]+d); parts.push(`${label(k)} ${d>=0?'+':''}${d}`);}
  if(o.flag)S.flags[o.flag]=true;
  addLog(`【${ev.t}】${o.n} → ${parts.join(' · ')||'什么也没发生'}`,'p');
  $('#modal').classList.add('hide');afterEvent();
 });
}
function showTrial(){
 const R=realm();
 const score=Math.round(S.dao*0.9+S.mind*0.7+S.hp*0.5+S.fame*0.3+S.master*0.2);
 const need=Math.round(R.need*1.15);
 const ok=score>=need;
 const box=$('#modalBox');
 box.innerHTML=`<h2>第${S.y-1}年 · ${TRIAL[S.realm].t}</h2>
  <p>${TRIAL[S.realm].q}</p>
  <p style="color:#8b9a92">这一劫要 <b style="color:#e8c96a">${need}</b> 分，你现在 <b style="color:${ok?'#8fd6a8':'#e0806a'}">${score}</b> 分<br>
  道行 ${Math.round(S.dao)} · 心性 ${Math.round(S.mind)} · 气血 ${Math.round(S.hp)} · 人望 ${Math.round(S.fame)}</p>
  <div class="opt" data-go="1">${ok?'迎劫':'硬着头皮上'}</div>`;
 $('#modal').classList.remove('hide');
 box.querySelector('[data-go]').onclick=()=>{$('#modal').classList.add('hide');resolveTrial(score,need);};
}
function resolveTrial(score,need){
 voice('d_'+TRIAL[S.realm].id+'_open');
 if(score>=need){
  S.realm=Math.min(9,S.realm+1);S.dao=Math.round(S.dao*0.4);S.realmXun=0;S.hp=clamp(S.hp-10);S.stone+=30+S.realm*10;
  addLog(`<b>渡过了 · 境界 → ${realm().n}</b>（灵石 +${30+S.realm*10}）`,'g');
  if(S.realm>=9)return ending('登仙');
  S.left=3;render();save();return;
 }
 const dmg=rnd(18,34);S.hp=clamp(S.hp-dmg);
 const f=Math.random();
 if(f<0.25){S.realm=Math.max(0,S.realm-1);S.dao=Math.round(S.dao*0.6);addLog(`劫没渡过，境界跌落。气血 −${dmg}`,'b');}
 else if(f<0.75){S.dao=Math.round(S.dao*0.75);addLog(`劫没渡过，气血 −${dmg}，道行受损`,'b');}
 else return endLife('劫殒');
 if(S.hp<=0)return endLife('劫殒');
 S.left=3;render();save();
}
function breakthrough(){
 voice('sys_break');
 S.realm=Math.min(9,S.realm+1);S.dao=0;S.realmXun=0;
 addLog(`<b>道行圆满 · 境界 → ${realm().n}</b>`,'g');
 if(S.realm>=9)return ending('登仙');
 render();save();
 if(S.left<=0) endXun();
}
function endLife(cause){
 voice('sys_fall');
 S.hp=0;addLog(`你倒下了。${cause}。`,'b');
 const box=$('#modalBox');
 box.innerHTML=`<h2>死</h2><p>${cause}。</p><p style="color:#8b9a92">第${S.lives}世 · ${realm().n} · 道行 ${Math.round(S.dao)} · 心性 ${Math.round(S.mind)}</p><div class="opt" data-go="1">再活一世（保留三成道行）</div>`;
 $('#modal').classList.remove('hide');
 box.querySelector('[data-go]').onclick=()=>{
  const keep=Math.round(S.dao*0.3),lives=S.lives+1,mind=S.mind;
  S=fresh();S.lives=lives;S.dao=12+keep;S.mind=Math.max(20,Math.round(mind*0.4));
  $('#modal').classList.add('hide');addLog('你睁开眼，又是个雪天。前世还剩一点东西在身上。','g');render();save();
 };
}
function ending(kind){
 voice('sys_xian');
 const box=$('#modalBox');
 const line=S.love>=60?'有人在山门外等你，等到雪化了。':S.love>=30?'你想过要不要去找她，最后还是没去。':'没有人来送你。';
 box.innerHTML=`<h2>${kind}</h2><p>天门开了。你回头看了一眼来路——${S.lives} 世，${S.y} 年。</p><p>${line}</p><p style="color:#8b9a92">道行 ${Math.round(S.dao)} · 心性 ${Math.round(S.mind)} · 人望 ${Math.round(S.fame)}</p><div class="opt" data-go="1">重头再来</div>`;
 $('#modal').classList.remove('hide');
 box.querySelector('[data-go]').onclick=()=>{S=fresh();$('#modal').classList.add('hide');render();save();};
}
load();render();
</script></body></html>
